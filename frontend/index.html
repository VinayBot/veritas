<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Veritas</title>
    <!--
      Theme bootstrap: dark is the default canvas (src/styles/tokens.css). Apply `.light` to
      <html> synchronously, before first paint, only when this viewer previously chose light
      (persisted by src/lib/theme.tsx under the same key) so the page never flashes the wrong
      theme once React mounts. Guarded because localStorage can throw.
    -->
    <script>
      (function () {
        try {
          if (window.localStorage.getItem('veritas:theme') === 'light') {
            document.documentElement.classList.add('light')
          }
        } catch (e) {
          /* storage unavailable: stay on the default dark theme */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
