[project]
name = "veritas"
version = "0.1.0"
description = "Veritas: an adaptive, agentic RAG platform with hybrid search, GraphRAG, an LLM council and layered guardrails."
requires-python = ">=3.11,<3.12"
dependencies = [
    # --- Phase 1: scaffold ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=13.0",
    "orjson>=3.10",
    # --- Phase 2: ingestion + PII vault ---
    "trafilatura>=1.12",
    "docling>=2.4",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7,<3.8",
    "numpy>=1.26,<2",
    "cryptography>=43.0",
    "datasketch>=1.6",
    "langdetect>=1.0.9",
    "striprtf>=0.0.26",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
    # --- Phase 3: chunking, embeddings, hybrid retrieval ---
    "sentence-transformers>=3.1",
    "chromadb>=0.5.15",
    "bm25s>=0.2.0",
    # --- Phase 4: reranker, HyDE, context dedup (litellm pulled forward from Phase 6 — HyDE
    # needs a real LLM call; see docs/DECISIONS.md) ---
    "litellm>=1.48",
    # --- Phase 5: GraphRAG ---
    "networkx>=3.3",
    "rapidfuzz>=3.9",
    # --- Phase 6: agentic RAG + semantic cache ---
    "langgraph>=0.2.28",
    # --- Phase 7: guardrails + red-team suite ---
    "transformers>=4.44",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
qdrant = ["qdrant-client>=1.11"]
neo4j = ["neo4j>=5.24"]
scrape = ["playwright>=1.47"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pypdf>=6.20.0",
    "reportlab>=5.0.1",
    "qdrant-client>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
# pytest 9's default import-mode (importlib) no longer prepends each test file's directory to
# sys.path, so plain `from conftest import helper` across test files needs this explicit entry
# instead — the standard fix for shared test utilities living next to conftest.py.
pythonpath = ["tests"]
markers = [
    "needs_ollama: calls a local model through Ollama; skipped when Ollama is not reachable (CI)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/ingestion/legacy/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
