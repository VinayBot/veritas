name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No unfinished-work markers in production code
        run: make no-stubs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.23"
      - name: Install dependencies
        run: uv sync
      - name: LibreOffice, for the legacy .doc/.xls parser tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy app
      # Tests marked needs_ollama call a local model and are skipped here with a reason (no
      # Ollama on GitHub runners); the embedder, reranker, Presidio, Docling and the injection
      # classifier still run for real.
      - name: pytest
        run: uv run pytest
      - name: Retrieval and ingestion tests on Qdrant (embedded) instead of ChromaDB
        env:
          VECTOR_STORE: qdrant
        run: >-
          uv run pytest --no-cov tests/test_vector_stores.py tests/test_hybrid_retrieval.py
          tests/test_retrieval_api.py tests/test_ingestion_service.py tests/test_documents_api.py
          tests/test_reranker.py tests/test_dedupe.py tests/test_hyde.py

  external-stores:
    # The server-backed options, against real servers: Neo4j for the knowledge graph and
    # Redis for rate-limit counters shared between processes.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/veritas-ci-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p veritas-ci-password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: veritas-ci-password
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.23"
      - name: Install dependencies
        run: uv sync
      - name: Graph store parity (NetworkX and Neo4j) and shared rate limits (Redis)
        run: uv run pytest --no-cov tests/test_graph_store_parity.py tests/test_guardrails_rate_limit.py -rs

  redteam:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.23"
      - name: Install dependencies
        run: uv sync
      # No Ollama in CI (would mean pulling multi-GB models on every run) — Llama Guard calls
      # fail open to "safe" via LlmUnavailableError, so this gate exercises the regex + DeBERTa
      # injection-classifier layers for real. Verified locally that the suite still clears both
      # hard gates with Llama Guard unavailable (95.2% block rate, right at the 95% floor) —
      # see docs/DECISIONS.md. `make redteam` run with Ollama up (e.g. locally) also exercises
      # Llama Guard and is the fuller signal; this is the CI-safe subset of it, not a separate gate.
      - name: Red-team suite (block rate >= 95%, false-positive rate <= 10%)
        run: uv run python scripts/run_redteam.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
